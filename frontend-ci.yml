name: Frontend CI Pipeline

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'educonflux-client/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'educonflux-client/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

jobs:
  frontend-test-and-build:
    name: Frontend Unit Tests & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: educonflux-client

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: educonflux-client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc -b

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Build Vite Production Bundle
        run: npm run build

